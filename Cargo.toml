[workspace]
resolver = "2"
members = ["contracts/tanda-escrow", "contracts/corridor-escrow-v1"]

# Release profile for Soroban Wasm builds (must live at the workspace root).
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
