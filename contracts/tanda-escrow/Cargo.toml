[package]
name = "tanda-escrow"
version = "0.2.0"
edition = "2021"
description = "Rotating-savings (tanda) escrow on Soroban: immutable group rules, member-signed contributions, permissionless release to the recorded beneficiary, self-service refunds. No admin role."
license = "Apache-2.0"
repository = "https://github.com/INDIGOAZUL/latanda-stellar-corridor"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = "26.1.0"

[dev-dependencies]
soroban-sdk = { version = "26.1.0", features = ["testutils"] }
