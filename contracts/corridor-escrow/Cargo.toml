[package]
name = "corridor-escrow"
version = "0.1.0"
edition = "2021"
description = "Non-custodial USDC corridor escrow (Soroban) for La Tanda's cross-border tanda remittance/payout rail on Stellar."
license = "Apache-2.0"
repository = "https://github.com/INDIGOAZUL/latanda-stellar-corridor"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = "26.1.0"

[dev-dependencies]
soroban-sdk = { version = "26.1.0", features = ["testutils"] }

# Recommended release profile for Soroban Wasm builds: small, overflow-checked,
# stripped. See soroban docs "Build optimized contracts".
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
